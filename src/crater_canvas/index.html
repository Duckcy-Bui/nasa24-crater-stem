<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #171717; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 4px 0 12px; background: white; }
    button, input { font: inherit; }
    button { border: 1px solid #bbb; border-radius: 6px; padding: 8px 12px; background: white; color: #171717; cursor: pointer; }
    button:hover { background: #eee; }
    button[aria-pressed="true"] { background: #171717; color: white; border-color: #171717; }
    button:disabled { opacity: .4; cursor: default; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .hint, #status { font-size: 13px; margin: 8px 0; line-height: 1.5; }
    #canvasWrap { width: 100%; max-width: 768px; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; background: #111; touch-action: none; border-radius: 4px; cursor: crosshair; }
    #editor { display: flex; align-items: end; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    label { font-size: 13px; display: grid; gap: 4px; }
    input { width: 110px; padding: 7px; border: 1px solid #bbb; border-radius: 5px; }
    #circles { max-height: 192px; overflow-y: auto; margin-top: 8px; }
    .circleRow { display: block; width: 100%; text-align: left; margin-bottom: 4px; font-size: 13px; }
    .circleRow[aria-pressed="true"] { background: #eee; color: #171717; }
    #error { color: #a40000; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="Công cụ khoanh hố">
    <button id="drawMode" type="button" aria-pressed="true">Vẽ vòng tròn</button>
    <button id="editMode" type="button" aria-pressed="false">Chọn / sửa</button>
    <button id="deleteCircle" type="button" disabled>Xóa vòng đã chọn</button>
    <button id="undo" type="button" disabled>Hoàn tác</button>
  </div>
  <p class="hint">Nhấn tại tâm hố rồi kéo ra vành để vẽ. Chuyển sang Chọn / sửa để kéo tâm hoặc vành vòng tròn.</p>
  <div id="canvasWrap"><canvas id="craterCanvas" width="512" height="512" aria-label="Ảnh Mặt Trăng để khoanh vòng tròn"></canvas></div>
  <p id="status" aria-live="polite">Đang mở ảnh…</p>
  <form id="editor" novalidate>
    <label>Tâm x (px)<input id="centerX" type="number" min="0" max="511" step="any" disabled></label>
    <label>Tâm y (px)<input id="centerY" type="number" min="0" max="511" step="any" disabled></label>
    <label>Bán kính (px)<input id="radius" type="number" min="0" step="any" disabled></label>
    <button id="applyEdit" type="submit" disabled>Áp dụng tọa độ</button>
  </form>
  <div id="error" role="alert"></div>
  <div id="circles" aria-label="Danh sách vòng tròn"></div>
  <p><button id="downloadAnswer" type="button" disabled>Tải câu trả lời JSON</button></p>
  <script src="geometry.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
